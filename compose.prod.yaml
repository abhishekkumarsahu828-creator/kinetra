# Optional Caddy HTTPS ingress overlay. Requires a public domain pointing to this server.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set your public domain}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set your certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
volumes:
  caddydata:
  caddyconfig:
