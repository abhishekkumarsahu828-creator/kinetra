name: Django CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kinetra_ci
          POSTGRES_USER: kinetra
          POSTGRES_PASSWORD: ci-only-not-for-production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinetra -d kinetra_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 'ci-only-random-placeholder-not-production'
      POSTGRES_DB: kinetra_ci
      POSTGRES_USER: kinetra
      POSTGRES_PASSWORD: ci-only-not-for-production
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test exchange -v 2
